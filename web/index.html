<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>easywriting-poem — Poetry Workshop</title>
    <meta
      name="description"
      content="A private poetry workshop for serious writers. Meter, rhyme, syllables, spelling, and AI analysis — all in your browser, no account required."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!--
      Installable, and the reason is space rather than novelty.

      The workshop pins the viewport on mobile, and Android Chrome only retracts
      its address bar and bottom toolbar when the root scroller moves — so inside
      the workshop those two bars are permanent, roughly 110px of a 730px screen.
      "display: standalone" is the one setting that removes them for good:
      installed from the browser menu, the app opens with no browser chrome at
      all. The in-app fullscreen button does the same thing per-session for
      anyone who would rather not install it.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#090f08" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="easywriting" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.easywritingpoem.org/" />
    <meta property="og:title" content="easywriting-poem — Poetry Workshop" />
    <meta
      property="og:description"
      content="A private poetry workshop for serious writers. Meter, rhyme, syllables, spelling, and AI analysis — all in your browser, no account required."
    />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="easywriting-poem — Poetry Workshop" />
    <meta
      name="twitter:description"
      content="A private poetry workshop for serious writers. Meter, rhyme, syllables, spelling, and AI analysis — no account required."
    />

    <!-- Network hints: warm DNS/TLS for the third-party origins we hit first. -->
    <!-- Google Fonts — display=swap is already set so text renders with system fallbacks while fonts load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Datamuse + dictionaryapi.dev are called the first time the user opens a rhyme/definition popover. -->
    <link rel="dns-prefetch" href="https://api.datamuse.com" />
    <link rel="dns-prefetch" href="https://api.dictionaryapi.dev" />
    <!-- Vercel analytics / speed insights endpoints. -->
    <link rel="dns-prefetch" href="https://va.vercel-scripts.com" />
    <link rel="dns-prefetch" href="https://vitals.vercel-insights.com" />
    <!--
      Fonts are split into two requests: the three the first paint actually uses,
      and the rest.

      Only Literata (--font-poem), DM Sans (--font-ui) and IBM Plex Mono
      (--font-metric, the syllable/meter numerals) are referenced by the default
      appearance, so only those block rendering. The other fourteen families exist
      solely as choices in the appearance picker; a reader who never opens it never
      needs them, and one who has a non-default font saved gets it a moment later
      via the normal display=swap path.

      This matters most exactly where it was reported — a phone on a slow link.
      Previously a single render-blocking stylesheet listing all seventeen families
      sat in front of first paint, so nothing rendered until a full round-trip to
      fonts.googleapis.com completed. The families themselves were never the weight
      (Google Fonts only downloads woff2 for families actually matched by rendered
      CSS); the blocking round-trip was.

      The media="print" swap is the standard way to make a stylesheet
      non-render-blocking: it downloads at normal priority but applies only once
      onload flips it to all. The noscript fallback below keeps it working with
      JS disabled. (Tag names are spelled out rather than written as markup here:
      a literal tag inside a comment is valid HTML and browsers handle it, but it
      readily confuses regex-based tooling that scans this file.)
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=DM+Serif+Display:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=DM+Serif+Display:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap"
      />
    </noscript>
  </head>
  <body>
    <noscript>
      <style>
        .ep-noscript {
          font-family: Georgia, "Times New Roman", serif;
          max-width: 640px;

          padding: 2.5rem 2rem;
          color: #253028;

        }

        .ep-noscript .ep-notice {
          margin-top: 2rem;
          padding: 1rem 1.2rem;

        }
        .ep-noscript a { color: #2f5a47; }
      </style>
      <div class="ep-noscript">
        <h1>easywriting-poem</h1>
        <p class="ep-tagline">A quiet place to write poetry.</p>

        <p>A private, browser-based poetry workshop. Draft on the left; syllables, meter, rhyme, repeats, and spelling update beside you. Optional AI critique on demand. Nothing leaves your browser unless you ask it to.</p>

        <h2>What it does</h2>
        <ul>
          <li><strong>Local-first.</strong> Drafts, snapshots, goals, and personal dictionary live in your browser. Works offline after first load.</li>
          <li><strong>Poetry-specific tools.</strong> Syllables, meter (CMU dictionary + heuristics), rhyme (strict/near/broad), repetition, poetry-aware spelling.</li>
          <li><strong>Optional AI.</strong> Critique with selectable harshness, line rewrites, idea sparks, theme generation. No signup.</li>
          <li><strong>Calm UI.</strong> No popups, no nags. Tools speak when asked.</li>
        </ul>

        <h2>Sample poem from the app</h2>
        <div class="ep-sample"><em>"The Candle"</em>The candle burns in winter's grip,
and shadows stretch across the floor.
A moth has pressed its paper wing
against the cold and frosted door.

The candle knows it cannot last —
its wax grows thin, its circle bright.
But still it burns to hold the past,
and moths will linger in its light.</div>

        <div class="ep-notice">
          <strong>JavaScript is required to use the workshop.</strong>
          The editor, syllable counter, rhyme tools, and everything else run client-side in JavaScript — there's no server to render them. Enable JavaScript in your browser settings (or whitelist this site in your content blocker) and reload to start writing.
        </div>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
